<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ResNet34 U-Net curve tracing pipeline</title>
  <desc id="desc">Two-lane diagram. Training creates noisy synthetic scans and one-pixel-per-column centerline labels, trains a ResNet34 U-Net using BCE, Dice, and column-wise loss, validates traces, and saves checkpoints. Inference tiles a real scan, blends model probabilities, applies one-y-per-x dynamic programming, and exports overlays, probability maps, and coordinates.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#edf4f7"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#183b56"/><stop offset="1" stop-color="#245f78"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#057f82"/><stop offset="1" stop-color="#26a3a0"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#163d55" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66899d"/></marker>
    <style>
      text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#183b56}
      .title{font-size:40px;font-weight:750;letter-spacing:-.5px}
      .subtitle{font-size:18px;fill:#5a7181}
      .lane{font-size:16px;font-weight:800;letter-spacing:2px;fill:#4e697b}
      .step{font-size:22px;font-weight:750}
      .body{font-size:16px;fill:#526b7a}
      .small{font-size:14px;fill:#6a8290}
      .badge{font-size:13px;font-weight:750;letter-spacing:.6px}
      .card{fill:#fff;stroke:#d8e5eb;stroke-width:1.5;filter:url(#shadow)}
      .flow{fill:none;stroke:#66899d;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#page)"/>
  <rect x="0" y="0" width="1600" height="11" fill="url(#teal)"/>
  <text x="72" y="76" class="title">Curve tracing with ResNet34 U-Net</text>
  <text x="74" y="112" class="subtitle">From noisy scanned charts to a single ordered curve and exportable pixel coordinates</text>
  <rect x="1252" y="50" width="272" height="36" rx="18" fill="#e4f3f2"/>
  <text x="1388" y="73" text-anchor="middle" class="badge" fill="#087b7d">SINGLE-CURVE PIPELINE</text>

  <!-- TRAINING LANE -->
  <rect x="56" y="155" width="1488" height="295" rx="26" fill="#edf5f9" stroke="#d7e7ee"/>
  <text x="86" y="193" class="lane">TRAINING · NEW SYNTHETIC SCANS EACH EPOCH</text>
  <path class="flow" d="M346 318H366"/><path class="flow" d="M636 318H656"/><path class="flow" d="M926 318H946"/><path class="flow" d="M1216 318H1236"/>

  <g>
    <rect class="card" x="86" y="220" width="260" height="196" rx="18"/>
    <rect x="104" y="238" width="68" height="64" rx="8" fill="#f1f5f5" stroke="#bfd0d9"/>
    <path d="M110 257H166M110 275H166M126 244V297M147 244V297" stroke="#c0cfd4" stroke-width="1.4"/>
    <path d="M110 281C119 280 122 253 132 261S143 290 150 268S161 254 167 257" fill="none" stroke="#d26a4c" stroke-width="2.8"/>
    <text x="188" y="264" class="step">Synthesize</text>
    <text x="105" y="336" class="body">Wide curve ink + dark grid</text>
    <text x="105" y="361" class="body">grain, spikes and markers</text>
    <text x="105" y="389" class="small">Image and exact y[x] are paired</text>
  </g>
  <g>
    <rect class="card" x="376" y="220" width="260" height="196" rx="18"/>
    <circle cx="413" cy="267" r="25" fill="#e4f3f2"/><path d="M397 268H429M413 252V284M399 280L427 254" stroke="#168d8e" stroke-width="2.4"/>
    <text x="447" y="264" class="step">Augment</text>
    <text x="395" y="336" class="body">Transform image + y[x]</text>
    <text x="395" y="361" class="body">together; normalize image</text>
    <text x="395" y="389" class="small">Targets remain aligned</text>
  </g>
  <g>
    <rect class="card" x="666" y="220" width="260" height="196" rx="18"/>
    <rect x="686" y="244" width="64" height="48" rx="6" fill="#152f3c"/>
    <path d="M692 270H743" stroke="#9fd8d1" stroke-width="1" stroke-dasharray="1 3"/>
    <circle cx="707" cy="265" r="2" fill="#fff"/><circle cx="713" cy="267" r="2" fill="#fff"/><circle cx="719" cy="271" r="2" fill="#fff"/><circle cx="725" cy="256" r="2" fill="#fff"/>
    <text x="760" y="264" class="step">Label</text>
    <text x="685" y="336" class="body">One target pixel per x</text>
    <text x="685" y="361" class="body">at row round(y[x])</text>
    <text x="685" y="389" class="small">Steep sections can look dotted</text>
  </g>
  <g>
    <rect class="card" x="956" y="220" width="260" height="196" rx="18"/>
    <rect x="977" y="243" width="53" height="50" rx="8" fill="url(#blue)"/>
    <path d="M986 267H1020M993 256V278M1003 252V283M1013 257V278" stroke="#a7dedb" stroke-width="2"/>
    <text x="1043" y="264" class="step">Train U-Net</text>
    <text x="975" y="336" class="body">ImageNet ResNet34 encoder</text>
    <text x="975" y="361" class="body">one grayscale input channel</text>
    <text x="975" y="389" class="small">One probability-map output</text>
  </g>
  <g>
    <rect class="card" x="1246" y="220" width="260" height="196" rx="18"/>
    <circle cx="1283" cy="268" r="25" fill="#fdf0e4"/><path d="M1270 268L1279 277L1297 257" fill="none" stroke="#c97531" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1317" y="264" class="step">Select</text>
    <text x="1265" y="336" class="body">BCE + Dice + column loss</text>
    <text x="1265" y="361" class="body">validate traced y[x]</text>
    <text x="1265" y="389" class="small">Save best.pt and last.pt</text>
  </g>

  <!-- SHARED MODEL CONNECTION -->
  <path d="M1376 420V466H818V566" fill="none" stroke="#22a09a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="980" y="451" width="239" height="31" rx="15" fill="#dff2ee"/>
  <text x="1100" y="472" text-anchor="middle" class="badge" fill="#087b7d">LOAD best.pt FOR INFERENCE</text>

  <!-- INFERENCE LANE -->
  <rect x="56" y="510" width="1488" height="292" rx="26" fill="#f1f6f8" stroke="#dbe7ec"/>
  <text x="86" y="548" class="lane">INFERENCE · ONE SCAN OR ONE TRACK CROP</text>
  <path class="flow" d="M346 666H366"/><path class="flow" d="M636 666H656"/><path class="flow" d="M926 666H946"/><path class="flow" d="M1216 666H1236"/>

  <g>
    <rect class="card" x="86" y="576" width="260" height="194" rx="18"/>
    <rect x="106" y="598" width="61" height="58" rx="6" fill="#f3f5f3" stroke="#b7cbd3"/>
    <path d="M111 616H162M111 637H162M125 602V651M146 602V651" stroke="#c7d2d6" stroke-width="1.4"/>
    <path d="M111 631Q125 621 133 638T162 614" fill="none" stroke="#233e4b" stroke-width="2.4"/>
    <text x="183" y="632" class="step">Input scan</text>
    <text x="105" y="702" class="body">Noisy grayscale image</text>
    <text x="105" y="729" class="small">Native scan pixel coordinates</text>
  </g>
  <g>
    <rect class="card" x="376" y="576" width="260" height="194" rx="18"/>
    <rect x="397" y="600" width="59" height="53" rx="5" fill="#e4f3f2" stroke="#92c9c8"/>
    <path d="M397 627H456M426 600V653" stroke="#168e8c" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="470" y="632" class="step">Tile</text>
    <text x="395" y="702" class="body">Overlap and normalize</text>
    <text x="395" y="729" class="small">No full-image downscaling</text>
  </g>
  <g>
    <rect class="card" x="666" y="576" width="260" height="194" rx="18"/>
    <path d="M686 627C700 615 709 639 723 625S747 614 760 628" fill="none" stroke="#21a59f" stroke-width="6" stroke-linecap="round" opacity=".5"/>
    <text x="778" y="632" class="step">Score</text>
    <text x="685" y="702" class="body">ResNet34 U-Net + sigmoid</text>
    <text x="685" y="729" class="small">Blend tile probability maps</text>
  </g>
  <g>
    <rect class="card" x="956" y="576" width="260" height="194" rx="18"/>
    <path d="M979 631L990 624L1002 639L1014 612L1026 625" fill="none" stroke="#d87554" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1043" y="632" class="step">Trace</text>
    <text x="975" y="702" class="body">Dynamic programming path</text>
    <text x="975" y="729" class="small">Exactly one y per x column</text>
  </g>
  <g>
    <rect class="card" x="1246" y="576" width="260" height="194" rx="18"/>
    <rect x="1267" y="604" width="43" height="49" rx="5" fill="#e8eef3" stroke="#9eb8c7"/>
    <path d="M1275 614H1302M1275 623H1302M1275 632H1295" stroke="#628397" stroke-width="2"/>
    <text x="1324" y="632" class="step">Export</text>
    <text x="1265" y="702" class="body">x,y CSV + red overlay</text>
    <text x="1265" y="729" class="small">Probability PNG + .npy</text>
  </g>

  <rect x="56" y="824" width="1488" height="49" rx="16" fill="#e5eef2"/>
  <text x="800" y="855" text-anchor="middle" class="body">Current notebook traces one curve per input crop; multiple curves in one scan require separate bands or a multi-instance method.</text>
</svg>
